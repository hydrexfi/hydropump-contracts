name: CI

# Four gates, each its own job so a failure is reported by name:
#   build     — compiles, stays under the EIP-170 size limit, and is forge-fmt clean
#   unit      — every test outside test/fork/
#   storage   — the four upgradeable contracts keep the storage layout of their committed snapshot
#   fork      — every suite under test/fork/ except test/fork/slow/, against Base via the
#               BASE_RPC_URL secret. PRs from forks cannot read the secret, so their fork job fails.
#
# The slow fork suites (test/fork/slow/, about 14 minutes) run by hand from fork-slow.yml.
#
# The Foundry toolchain is pinned (see foundry-version-check.yml for why). Every `version:`
# input below must stay identical; the version check asserts it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build, sizes and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build and check contract sizes
        run: forge build --sizes
      - name: Check formatting
        run: npm run fmt:check

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Run unit tests
        run: npm run test:unit

  fork:
    name: fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run per branch at a time, so pushes do not pile parallel load onto the one RPC key.
    concurrency:
      group: fork-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # Exits 3, with an "RPC throttled" annotation, when every failure was the RPC rather than the code.
      - name: Run fork tests
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          FOUNDRY_ETH_RPC_TIMEOUT: 120
        run: npm run test:fork:strict

  # Any change that adds, removes or reorders storage in HydropumpLauncher, HydropumpLocker,
  # PairDirectory or FeeUseRegistry must add a new versioned snapshot in artifacts-storage/.
  storage:
    name: storage layout snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # A snapshot records a layout that is live on chain, so it is only ever added to. Editing or
      # deleting one would let a layout change pass the check below.
      - name: Refuse edits to committed snapshots
        if: github.event_name == 'pull_request'
        run: |
          CHANGED="$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- artifacts-storage/)"
          if [ -n "$CHANGED" ]; then
            echo "::error::Committed storage snapshots were modified, deleted or renamed: $CHANGED"
            echo "Add a new versioned snapshot instead (see CLAUDE.md, 'Upgradeable contracts and storage')."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      # foundry.toml resolves @openzeppelin/* from node_modules, so deps must be present first.
      - run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Check storage layouts against committed snapshots
        run: npm run check:storage-snapshots
