name: slow fork tests

# The fork suites under test/fork/slow/, too long for every PR: they launch against every generated
# quote token and take about 15 minutes. Run this by hand from the Actions tab, on any branch, after
# changing the quote list, the launch curve or the launcher. CI (ci.yml) runs the other fork suites.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-slow:
    name: slow fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # Exits 3, with an "RPC throttled" annotation, when every failure was the RPC rather than the code.
      - name: Run slow fork tests
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          FOUNDRY_ETH_RPC_TIMEOUT: 300
        run: npm run test:fork:slow
