[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path = 'cache_forge'
solc_version = "0.8.26"
skip = ['contracts/plugins/**', 'test/plugins/**', 'script/plugins/**']
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./script" }, { access = "read", path = "./out/plugins" }]

[profile.plugins]
src = 'contracts/plugins'
test = 'test/plugins'
script = 'script/plugins'
out = 'out/plugins'
cache_path = 'cache_forge/plugins'
solc_version = '0.8.20'
evm_version = 'paris'
# Factory embeds plugin creation bytecode; keep runtime below EIP-170.
via_ir = true
bytecode_hash = 'none'
skip = []

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
